# Mantiene activo el proyecto de Supabase (plan Free): Supabase pausa los
# proyectos sin actividad durante ~7 días. Una vez al día hace una consulta
# mínima de solo lectura. Ver docs/architecture-decisions/03_Arquitectura_Software.md §6.1.
#
# - Usa SOLO la clave pública "anon" (la misma que podría ir en un navegador),
#   nunca la service role key. Con RLS activado y sin políticas, la consulta
#   devuelve una lista vacía: no expone ningún dato, pero sí toca la base de datos.
# - Si Supabase no responde con 200 (p. ej. porque el proyecto ya está pausado),
#   el job falla y GitHub avisa por correo: sirve también de alarma.
# - GitHub solo ejecuta los workflows programados desde la rama por defecto del
#   repositorio (hoy `develop`, ver ADR-03 §6.1).
name: Supabase keep-alive

on:
  schedule:
    - cron: "17 7 * * *" # todos los días a las 07:17 UTC (fuera de la hora en punto, que GitHub satura)
  workflow_dispatch: # permite lanzarlo a mano desde la pestaña Actions

permissions: {} # no necesita ningún permiso sobre el repositorio

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Consulta mínima a Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Faltan los secretos SUPABASE_URL y/o SUPABASE_ANON_KEY (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          status=$(curl --silent --output /dev/null --write-out "%{http_code}" --max-time 30 \
            --header "apikey: $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/category_catalog?select=id&limit=1")
          echo "Respuesta de Supabase: HTTP $status"
          if [ "$status" != "200" ]; then
            echo "::error::Supabase respondió HTTP $status. Revisa si el proyecto está pausado (dashboard de Supabase) o si la clave es correcta."
            exit 1
          fi
