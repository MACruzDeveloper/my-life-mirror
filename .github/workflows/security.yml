# Controles de seguridad automáticos (DevSecOps a escala pequeña):
#  - `npm audit`: falla si una dependencia tiene una vulnerabilidad conocida alta o crítica.
#  - CodeQL: análisis estático del código en busca de patrones inseguros (inyección,
#    datos sin validar…). Los resultados salen en la pestaña Security → Code scanning.
# No necesita ningún secreto. Ver docs/security/01_Plan_Seguridad.md, pasos 2 y 3.
name: Seguridad

on:
  pull_request:
  push:
    branches: [main, develop]
  # Cada lunes: una vulnerabilidad puede publicarse sin que el código cambie.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Dependencias (npm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Lee package-lock.json; no hace falta instalar nada.
      - name: Auditar dependencias
        run: npm audit --audit-level=high

  codeql:
    name: Código (CodeQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # para publicar los resultados en la pestaña Security
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          # Además de las reglas de seguridad por defecto, las ampliadas.
          queries: security-extended

      - uses: github/codeql-action/analyze@v3
